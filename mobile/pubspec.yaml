name: ramad_assistant_mobile
description: "Dedicated mobile client for Ramad Command Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Networking & State
  http: ^1.2.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2

  # Icons & UI Elements
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
